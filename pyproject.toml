[project]
name = "tesis-primate"
version = "0.3.0"
description = "Detección de vocalizaciones de primates en espectrogramas"
readme = "README.md"
requires-python = ">=3.12"
# Lo que corre el visor con inferencia (`python src/main.py`): abre checkpoints de Faster R-CNN.
#   investigación:   uv sync   (todos los grupos; `train` trae los extras detr y yolo)
#   sólo el visor:   uv sync --no-default-groups [--extra detr] [--extra yolo]
dependencies = [
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.21.0",
]

# Checkpoints de las otras arquitecturas (`models.registry.ARCHITECTURES`)
[project.optional-dependencies]
detr = [
    "timm>=1.0.29",
    "transformers>=5.0.0",
]
yolo = ["opencv-python>=4.10", "ultralytics>=8.4.126"]

[dependency-groups]
# Preparar datos, entrenar y comparar (src/prepare_*.py, train.py, export_yolo.py, dump_*, compare_*)
train = [
    "python-slugify>=8.0.4",
    "scipy>=1.18.0",
    "tqdm>=4.67.1",
    "tesis-primate[detr,yolo]",
]
notebooks = [
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    { include-group = "train" },
]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.3.4",
    "ruff>=0.14.14",
    "scipy-stubs>=1.18.1.0",
    "ty>=0.0.29",
]

[tool.uv]
# `uv sync` es exacto: sin esto, uno a secas (o el de VS Code) borraba los extras y los grupos
default-groups = "all"

[tool.ruff]
line-length = 100
src = ["src"]
exclude = [".git", "__pycache__", ".venv", ".ruff_cache", ".ty_cache", "notebooks/TF_Experimental_Training.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "N812", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "B018", "F401", "B007", "B905"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"  # los tipos los revisa ty; Pylance queda para navegar
# deploy/, docs/, notebooks/ y research/ meten src/ en sys.path al arrancar
extraPaths = ["src"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src"]
exclude = [".git", "__pycache__", ".venv", ".ruff_cache", ".ty_cache", ".pytest_cache", ".jupyter"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "torch.**",
    "torchvision.**",
    "transformers.**",
]

[tool.ty.terminal]
output-format = "concise"

[tool.pytest.ini_options]
pythonpath = ["src"]
