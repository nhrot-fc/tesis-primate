[project]
name = "tesis-primate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "python-slugify>=8.0.4",
    "scipy>=1.18.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=5.0.0",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.14.14", "ty>=0.0.29"]

[tool.ruff]
line-length = 100
src = ["src"]
exclude = [".git", "__pycache__", ".venv", ".ruff_cache", ".ty_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "N812", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "B018", "F401"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src", "main.py"]
exclude = [".git", "__pycache__", ".venv", ".ruff_cache", ".ty_cache", ".pytest_cache", ".jupyter"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "torch.**",
    "torchvision.**",
    "transformers.**",
]

[tool.ty.terminal]
output-format = "concise"

[tool.pytest.ini_options]
pythonpath = ["src"]
